# Explanation script: 12 steps on x = [4, 6, 10, 12, 8, 6, 5, 5] (docs/02-theory.md, {#haar-explain-script}).
# text_haar is the canvas wording (docs/design/Bank.dc.html) and is used for the orthonormal Haar bank;
# text is the same idea for any bank. {{name}} placeholders are filled by fill() in explain_model.cpp.

[[step]]
title = "сигнал"
highlight = ["x"]
rows = ["x"]
invariant = "energy"
view = ""
text_haar = ["x — {{n}} отсчётов. Задача: разложить сигнал", "на средние и разности и собрать обратно", "без потерь.", "", "инвариант: ‖x‖² = {{x.energy}}"]
text = ["x — {{n}} отсчётов. Задача: разложить сигнал", "на низкие и высокие частоты и собрать", "обратно без потерь.", "", "инвариант: ‖x‖² = {{x.energy}}"]

[[step]]
title = "фильтры h₀, h₁"
highlight = ["H0", "H1"]
rows = ["x"]
invariant = "power_complementary"
view = "filters"
text_haar = ["h₀ = [1, 1]/√2 — среднее пары (ФНЧ),", "h₁ = [1, −1]/√2 — разность (ФВЧ).", "f₀ = [1, 1]/√2,  f₁ = [−1, 1]/√2.", "", "инвариант: |H₀|² + |H₁|² = 2"]
text = ["h₀ = {{h0}} — ФНЧ,", "h₁ = {{h1}} — ФВЧ,", "f₀ = {{f0}},", "f₁ = {{f1}}.", "инвариант: |H₀|² + |H₁|² = {{pc_gain}}"]

[[step]]
title = "свёртки y₀, y₁"
highlight = ["H0", "H1", "y0", "y1"]
rows = ["x", "y0", "y1"]
invariant = "conv_length"
view = ""
text_haar = ["Полные свёртки длины {{conv_len}}:", "y₀[m] = (x[m] + x[m−1])/√2", "y₁[m] = (x[m] − x[m−1])/√2", "", "инвариант: длина N + L − 1 = {{conv_len}}"]
text = ["Полные свёртки длины {{conv_len}}:", "y₀ = h₀ ∗ x,  y₁ = h₁ ∗ x.", "", "", "инвариант: длина N + L − 1 = {{conv_len}}"]

[[step]]
title = "прореживание ↓2"
mark_kept = true
highlight = ["D0", "D1", "a", "d"]
rows = ["x", "y0", "y1", "a", "d"]
invariant = "coefficient_count"
view = ""
text_haar = ["↓2 оставляет каждый второй отсчёт —", "{{parity}} индексы {{kept}} ({{phase}}).", "Спектр растягивается вдвое, появляется", "зеркальная копия X(−z): наложение есть", "в КАЖДОЙ ветви, оно сократится на шаге 8.", "инвариант: {{n}} входов → {{a_count}} + {{d_count}} коэффициента"]
text = ["↓2 оставляет каждый второй отсчёт —", "{{parity}} индексы {{kept}} ({{phase}}).", "Спектр растягивается вдвое, появляется", "зеркальная копия X(−z): наложение есть", "в каждой ветви, оно сократится на шаге 8.", "инвариант: {{n}} входов → {{a_count}} + {{d_count}} коэффициента"]

[[step]]
title = "коэффициенты и энергия"
highlight = ["a", "d"]
rows = ["x", "y0", "y1", "a", "d"]
invariant = "parseval"
view = "decomposition"
text_haar = ["a[k] = (x[2k] + x[2k+1])/√2 — среднее,", "d[k] = (x[2k+1] − x[2k])/√2 — разность.", "Энергия почти вся в a: гладкий сигнал.", "", "инвариант: {{x.energy}} = {{a.energy}} + {{d.energy}} (Парсеваль)"]
text = ["a — выход ФНЧ после ↓2, d — выход ФВЧ.", "Доля энергии в a: {{a.share}}.", "", "", "инвариант: {{x.energy}} = {{a.energy}} + {{d.energy}} (Парсеваль)"]

[[step]]
title = "растяжение ↑2"
highlight = ["U0", "U1", "u0", "u1"]
rows = ["x", "y0", "y1", "a", "d", "u0", "u1"]
invariant = "upsampled_length"
view = ""
text_haar = ["↑2 вставляет нули между отсчётами.", "В частотах — сжатие спектра и копия", "(imaging); её уберут фильтры синтеза.", "", "инвариант: u — снова {{u_len}} отсчётов"]
text = ["↑2 вставляет нули между отсчётами.", "В частотах — сжатие спектра и копия", "(imaging); её уберут фильтры синтеза.", "", "инвариант: u — снова {{u_len}} отсчётов"]

[[step]]
title = "синтез f₀, f₁"
highlight = ["F0", "F1"]
rows = ["x", "y0", "y1", "a", "d", "u0", "u1", "w0", "w1"]
invariant = "synthesis_split"
view = ""
text_haar = ["w₀ = f₀ ∗ u₀ — кусочно-постоянное среднее,", "w₁ = f₁ ∗ u₁ — детали ±d/√2.", "", "", "инвариант: w₁ = x − w₀"]
text = ["w₀ = f₀ ∗ u₀ — низкочастотная часть,", "w₁ = f₁ ∗ u₁ — детали.", "", "", "инвариант: w₁ = x − w₀"]

[[step]]
title = "сумма = x"
highlight = ["S", "xh"]
rows = ["x", "y0", "y1", "a", "d", "u0", "u1", "w0", "w1", "xh"]
invariant = "reconstruction"
view = ""
text_haar = ["x̂ = w₀ + w₁ = x — точно и {{shift}}:", "анализ с нечётной фазой ≡ фильтры zHᵢ(z).", "Наложение двух ветвей взаимно погасло.", "", "инвариант: x̂ − x = {{error}}"]
text = ["x̂ = w₀ + w₁ = x — точно и {{shift}}.", "Наложение двух ветвей взаимно погасло:", "F₀H₀(−z) + F₁H₁(−z) = 0.", "", "инвариант: x̂ − x = {{error}}"]

[[step]]
title = "матричный вид"
highlight = ["H0", "H1", "D0", "D1"]
rows = ["x", "y0", "y1", "a", "d"]
invariant = "orthogonal_matrix"
view = "matrix"
text_haar = ["То же как матрица: [a; d] = A₁ · x.", "Строки L — сдвиги h₀ на 2, строки B —", "сдвиги h₁. Синтез — транспонирование.", "", "инвариант: {{matrix_identity}}"]
text = ["То же как матрица: [a; d] = A₁ · x.", "Строки L — сдвиги h₀ на 2, строки B —", "сдвиги h₁. Синтез S восстанавливает x.", "", "инвариант: {{matrix_identity}}"]

[[step]]
title = "многоуровневое дерево"
highlight = ["a"]
rows = ["x", "y0", "y1", "a", "d", "tree"]
invariant = "tree_energy"
view = "decomposition"
text_haar = ["Повторяем шаг на a: a₂ = {{a2}},", "d₂ = {{d2}}; затем a₃ = {{a3}},", "d₃ = {{d3}}. Это пирамида Малла.", "", "инвариант: {{tree.energy}}"]
text = ["Повторяем шаг на a: a₂ = {{a2}},", "d₂ = {{d2}}; затем a₃ = {{a3}},", "d₃ = {{d3}}. Это пирамида Малла.", "", "инвариант: {{tree.energy}}"]

[[step]]
title = "частотный вид"
highlight = ["H0", "H1", "F0", "F1"]
rows = ["x", "y0", "y1", "a", "d"]
invariant = "alias_cancelled"
view = "filters"
text_haar = ["|H₀| = √2·cos(ω/2), |H₁| = √2·sin(ω/2).", "Срез −3 дБ ровно на π/2, но спад", "медленный: полосы сильно перекрываются.", "", "инвариант: T = z⁻¹, A = 0"]
text = ["|H₀| и |H₁| — на графике справа.", "Срез −3 дБ на {{cutoff}},", "утечка ФВЧ при π/4: {{leak}}.", "", "инвариант: T = z^−ℓ (ℓ = {{delay}}), A = 0"]

[[step]]
title = "эксперимент: d = 0"
highlight = ["d", "S", "xh"]
rows = ["x", "y0", "y1", "a", "d", "u0", "u1", "xh"]
invariant = "zero_detail_error"
view = "decomposition"
text_haar = ["Обнуляем d: x̂ = w₀, ошибка = w₁.", "Наложение больше не гасится:", "|A(ω)| = ½|sin ω|, максимум {{alias_db}} дБ", "на π/2 — так появляются артефакты", "при правке полос децимированного DWT.", "лекарство: SWT или пакеты (§11)"]
text = ["Обнуляем d: x̂ = w₀, ошибка = w₁.", "Наложение больше не гасится:", "max |A(ω)| = {{alias_db}} дБ —", "так появляются артефакты", "при правке полос децимированного DWT.", "лекарство: SWT или пакеты (§11)"]
