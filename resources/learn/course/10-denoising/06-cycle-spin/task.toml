kind = "graph"
open = "pipeline"
theory = ["audio-denoising", "met-snr"]
locked = ["x", "n", "y1"]

[[param]]
name = "snr"
kind = "int"
min = 8
max = 12

[[param]]
name = "seed"
kind = "int"
min = 1
max = 50

[[measure]]
name = "single"
kind = "snr"
a = "y1"
b = "x"
delay = 0

[[measure]]
name = "multi"
kind = "snr"
a = "y"
b = "x"
delay = 0

[[goal]]
when = "multi - single >= 0.5"

[[goal]]
through = { from = "n", to = "y", block = "denoise" }
