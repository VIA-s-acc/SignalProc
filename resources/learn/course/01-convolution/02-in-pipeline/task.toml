kind = "graph"
theory = ["lti-convolution", "toeplitz-convolution"]
locked = ["x"]

[[param]]
name = "x"
kind = "ints"
count = 8
min = -9
max = 9

[[param]]
name = "h"
kind = "ints"
count = 3
min = 1
max = 4

[input]
node = "x"
hidden = 3

[[measure]]
name = "err"
kind = "max_error"
a = "y"
ref = "y"

[[measure]]
name = "n"
kind = "length"
a = "y"

[[goal]]
when = "err <= 1e-12"

[[goal]]
when = "n == 10"
