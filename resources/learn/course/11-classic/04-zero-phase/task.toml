kind = "graph"
open = "pipeline"
theory = ["cls-iir-prototypes", "classic"]
locked = ["low", "high", "x"]

[[param]]
name = "a"
kind = "real"
min = 0.5
max = 2
decimals = 1

[[measure]]
name = "lag"
kind = "delay"
a = "y"
b = "x"

[[measure]]
name = "stop"
kind = "gain_db"
a = "y"
b = "x"
freq = 2000

[[measure]]
name = "pass"
kind = "gain_db"
a = "y"
b = "x"
freq = 300

[[goal]]
when = "lag == 0"

[[goal]]
when = "stop <= -40"

[[goal]]
when = "pass >= -1"
