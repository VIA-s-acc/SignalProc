kind = "graph"
open = "pipeline"
theory = ["haar-multilevel", "sig-own-blocks"]
locked = ["x"]

[[param]]
name = "x"
kind = "ints"
count = 16
min = -9
max = 9

[input]
node = "x"
hidden = 4

[[measure]]
name = "err"
kind = "max_error"
a = "y"
b = "x"
delay = "auto"

[[goal]]
when = "err <= 1e-12"

[[goal]]
defines = { calls = 2 }

[[goal]]
require = { downsample = 4, upsample = 4 }

[[goal]]
forbid = ["dwt", "idwt", "swt", "iswt", "lift53", "ilift53", "lift97", "ilift97", "wpt", "iwpt", "dtcwt", "idtcwt", "mra", "denoise", "polyphase", "ipolyphase"]
