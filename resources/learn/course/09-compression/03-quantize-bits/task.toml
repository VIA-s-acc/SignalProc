kind = "graph"
open = "pipeline"
theory = ["audio-compression", "transforms"]
locked = ["x", "w"]

[[param]]
name = "n"
kind = "choice"
choices = ["1024", "2048"]

[[measure]]
name = "snr"
kind = "snr"
a = "y"
b = "x"
delay = 0

[[measure]]
name = "bits"
kind = "param"
param = "q.bits"

[[goal]]
when = "snr >= 40"

[[goal]]
when = "bits <= 6"

[[goal]]
through = { from = "x", to = "y", block = "coeff_quantize" }
