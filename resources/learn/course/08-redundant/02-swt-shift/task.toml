kind = "graph"
open = "pipeline"
theory = ["swt-modwt", "transforms"]
locked = ["x"]

[[param]]
name = "x"
kind = "ints"
count = 16
min = -9
max = 9

[input]
node = "x"
hidden = 4

[[measure]]
name = "err"
kind = "max_error"
a = "p"
b = "q"
delay = 0
trim = 2

[[goal]]
when = "err <= 1e-12"

[[goal]]
through = { from = "x", to = "p", block = "swt" }

[[goal]]
through = { from = "x", to = "q", block = "swt" }

[[goal]]
require = { swt = 2, shift = 2 }
