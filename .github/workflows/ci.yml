name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
            preset: release
          - os: ubuntu-24.04
            cxx: g++-14
            preset: release
          - os: ubuntu-24.04
            cxx: g++-14
            preset: dev
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Shells and man tools for the CLI docs tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish mandoc
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSIGNALS_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          export CXXFLAGS=-MP
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIGNALS_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --target signals --parallel 4
      - name: Check
        run: build/app/Release/signals.exe check
