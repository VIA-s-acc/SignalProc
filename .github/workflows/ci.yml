name: ci

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            cxx: clang++
            preset: release
          - os: ubuntu-24.04
            cxx: g++-14
            preset: release
          - os: ubuntu-24.04
            cxx: g++-14
            preset: dev
    runs-on: ${{ matrix.os }}
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Shells and man tools for the CLI docs tests
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh fish mandoc
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DSIGNALS_WERROR=ON
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Install script
        if: matrix.preset == 'release'
        run: |
          if command -v shellcheck > /dev/null; then shellcheck install.sh packaging/*.sh; fi
          sh packaging/test_install.sh build/release/app/signals
      - name: Homebrew formula
        if: matrix.preset == 'release' && runner.os == 'macOS'
        run: sh packaging/homebrew/test_render.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          export CXXFLAGS=-MP
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIGNALS_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --target signals --parallel 4
      - name: Check
        run: build/app/Release/signals.exe check
      - name: Install script
        run: |
          rel="$(cygpath -u "$RUNNER_TEMP")/rel"
          sh packaging/package.sh build/app/Release/signals.exe windows-x86_64 v9.9.9 "$rel/v9.9.9"
          (cd "$rel/v9.9.9" && sha256sum signals-v9.9.9-windows-x86_64.zip > SHA256SUMS)
          pwsh -NoProfile -File packaging/test_install.ps1 -Release "$(cygpath -w "$rel")"
          powershell -NoProfile -ExecutionPolicy Bypass -File packaging/test_install.ps1 -Release "$(cygpath -w "$rel")"

  gallery:
    runs-on: ubuntu-24.04
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSIGNALS_BUILD_TESTS=OFF -DSIGNALS_BUILD_GALLERY=ON -DSIGNALS_WERROR=ON
      - name: Build
        run: cmake --build build --target signals-gallery --parallel 4
      - name: Render every screen
        run: |
          build/tools/gallery/signals-gallery --out "$RUNNER_TEMP/gallery" --lang en
          test "$(ls "$RUNNER_TEMP/gallery"/*.svg | wc -l)" -eq 19
