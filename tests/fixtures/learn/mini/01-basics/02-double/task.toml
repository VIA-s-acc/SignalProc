kind = "graph"
theory = ["lti-convolution", "conv-signals"]
locked = ["x"]

[[param]]
name = "x"
kind = "ints"
count = 6
min = -5
max = 5

[input]
node = "x"
hidden = 2

[[measure]]
name = "err"
kind = "max_error"
a = "y"
ref = "y"

[[measure]]
name = "adds"
kind = "count"
block = "add"

[[goal]]
when = "err <= 1e-12"

[[goal]]
require = { add = 1 }

[[goal]]
forbid = ["gain", "affine"]
